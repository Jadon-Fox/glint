# Required-check candidate: pytest smoke. Advisory: pytest numpy, cuda compile, CodeQL — do not require as merge gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-smoke:
    name: pytest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run codec/pin/tool tests, stdlib only (no CUDA build)
        run: python -m pytest -q

  pytest-numpy:
    name: pytest numpy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + numpy
        run: pip install pytest numpy safetensors
      - name: Run tests with the f32-exact numpy encoder
        run: python -m pytest -q -rs

  cuda-compile:
    name: cuda compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nvidia-cuda-toolkit
      - name: Build libglint_encode.so (sm_86)
        run: bash scripts/build_glint_cuda.sh
      - name: Compile H-TILE object (sm_86)
        run: nvcc -O3 -std=c++17 -arch=sm_86 -Iinclude -c cuda/glint_htile.cu -o glint_htile.o
      - name: glint_encode.h declares the device entry point in any include order
        run: |
          printf '#include "glint_encode.h"\nvoid *p = (void *)glint_expand_packed_to_f32_device;\n' | gcc -fsyntax-only -Wall -Werror -Iinclude -x c -
          printf '#include "glint_encode.h"\n#include <cuda_runtime.h>\nint main() { cudaStream_t s = 0; return glint_expand_packed_to_f32_device(0, 0, 0, 0, 1, 0, s); }\n' > order.cu
          nvcc -std=c++17 -Iinclude -c order.cu -o order.o
      - name: Exported symbols
        run: nm -D libglint_encode.so | grep -E ' T glint_'
